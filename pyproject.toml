[project]
name = "large-behavior-model"
version = "0.1.0"
description = "An LLM-based model for predicting individual human behavior."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "notebook>=7.2",
    "pandas>=2.2",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.14",
    "torch>=2.4",
    "tqdm>=4.66",
    "transformers>=4.56.2,<5",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.13.0,<2",
    "peft>=0.18.0,<0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_modeling"]

[dependency-groups]
dev = [
    "black[jupyter]>=24.8",
    "jupyter-black>=0.4.0",
    "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$|\.ipynb$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''
